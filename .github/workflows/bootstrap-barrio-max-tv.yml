name: Build Barrio MAX TV v1

on:
  push:
    branches: [feat/barrio-max-tv-v1]

permissions:
  contents: write

jobs:
  assemble-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/barrio-max-tv-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Assemble the complete application
        run: |
          cat .bootstrap/chunk* > /tmp/barrio-max-tv.b64
          base64 --decode /tmp/barrio-max-tv.b64 > /tmp/barrio-max-tv.tar.gz
          tar -xzf /tmp/barrio-max-tv.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-barrio-max-tv.yml

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Commit verified application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: crear plataforma Barrio MAX TV"
          git push origin HEAD:feat/barrio-max-tv-v1
